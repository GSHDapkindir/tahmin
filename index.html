<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galatasaray × Stuttgart | Canlı Skor</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --yellow: #ffdc35;
  --red: #e50932;
  --dark: #100b12;
  --panel: #21151f;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top left, #631425 0%, transparent 48%),
    radial-gradient(ellipse at bottom right, #674313 0%, transparent 48%),
    var(--dark);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 520px;
}

.match-card {
  background: linear-gradient(145deg, #301822, #130e15);
  border: 1px solid #70402f;
  border-radius: 24px;
  padding: 28px 18px;
  text-align: center;
  box-shadow: 0 20px 60px #0008;
}

.date {
  color: #ffdc91;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
}

.team {
  font-size: clamp(15px, 4vw, 22px);
  font-weight: 900;
  overflow-wrap: anywhere;
}

.galatasaray {
  background: linear-gradient(
    110deg,
    #ffdc35,
    #ff4a3d,
    #fff2a2,
    #d40032,
    #ffdc35
  );
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 2s linear infinite;
  filter: drop-shadow(0 0 9px #ffbd2444);
}

.stuttgart {
  color: #fff;
  text-shadow: 0 0 12px #ffffff65;
}

@keyframes shine {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.vs {
  font-size: 12px;
  color: #a99a9f;
  font-weight: bold;
}

.score {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 30px 0;
  font-size: clamp(65px, 17vw, 105px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.score span {
  min-width: 80px;
}

.score .separator {
  min-width: auto;
  font-size: 55px;
  color: #ffca47;
}

.home-score {
  color: var(--yellow);
  text-shadow: 0 0 25px #ffbb3444;
}

.away-score {
  color: white;
}

.status {
  display: inline-block;
  color: #ffdc35;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

button {
  border: none;
  border-radius: 13px;
  padding: 16px 20px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

button:active {
  transform: scale(.96);
}

.stop-btn {
  width: 100%;
  background: linear-gradient(110deg, #ffdf42, #ff922c, #e8193b);
  color: #180c0e;
  box-shadow: 0 7px 25px #ff4a2440;
}

.restart-btn {
  width: 100%;
  margin-top: 12px;
  background: #35232b;
  color: white;
  border: 1px solid #69404a;
}

.overlay {
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 10;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 12px;
  overflow-y: auto;
}

.overlay.active {
  display: flex;
}

.popup {
  width: 100%;
  max-width: 480px;
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  scrollbar-width: thin;
}

.capture {
  position: relative;
  background:
    radial-gradient(circle at 0% 0%, #7c202e 0%, transparent 45%),
    radial-gradient(circle at 100% 100%, #745018 0%, transparent 45%),
    linear-gradient(150deg, #28141e, #100c14);
  border: 2px solid #c18a39;
  border-radius: 22px;
  padding: 27px 17px 23px;
  text-align: center;
  overflow: hidden;
}

.capture::before {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ffe05b, #e50932, transparent);
}

.result-label {
  color: #ffdc80;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: 900;
}

.result-date {
  color: #c5aeb3;
  font-size: 12px;
  margin-top: 9px;
}

.result-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 25px;
}

.result-score {
  font-size: clamp(58px, 14vw, 82px);
  font-weight: 900;
  margin: 12px 0 20px;
  color: white;
  text-shadow: 0 0 25px #e5093255;
}

.result-score b {
  color: #ffdc35;
}

.events {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  text-align: left;
  margin-top: 20px;
}

.event-column {
  min-width: 0;
  background: #ffffff09;
  border: 1px solid #ffffff16;
  border-radius: 13px;
  padding: 12px 9px;
}

.event-title {
  font-size: 12px;
  font-weight: 900;
  color: #ffdb6b;
  margin-bottom: 12px;
  border-bottom: 1px solid #ffffff20;
  padding-bottom: 9px;
}

.event {
  margin-bottom: 13px;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.event:last-child {
  margin-bottom: 0;
}

.minute {
  color: #ffdc35;
  font-weight: bold;
}

.scorer {
  font-weight: bold;
  color: white;
}

.assist {
  color: #bcb1b6;
  font-size: 11px;
}

.analysis {
  text-align: left;
  margin-top: 18px;
  background: #ffce3210;
  border: 1px solid #ffce3240;
  border-radius: 13px;
  padding: 15px;
}

.analysis h3 {
  margin: 0 0 10px;
  color: #ffdb62;
  font-size: 14px;
}

.analysis p {
  margin: 0;
  font-size: 13px;
  line-height: 1.7;
  color: #f5e8e6;
}

.popup-buttons {
  display: grid;
  gap: 9px;
  margin-top: 12px;
}

.save-btn {
  background: linear-gradient(110deg, #ffdd43, #ff9e2d);
  color: #1c1010;
}

.telegram-btn {
  background: #229ed9;
  color: white;
}

.close-btn {
  background: #37252d;
  color: white;
}

@media (max-width: 380px) {
  .match-card {
    padding: 24px 12px;
  }

  .score {
    gap: 10px;
  }

  .capture {
    padding: 23px 10px;
  }

  .event-column {
    padding: 10px 7px;
  }
}
</style>
</head>

<body>

<main class="app">
  <div class="match-card">

    <div class="date">
      03.11.2026 • 20:45
    </div>

    <div class="teams">
      <div class="team galatasaray">GALATASARAY</div>
      <div class="vs">X</div>
      <div class="team stuttgart">STUTTGART</div>
    </div>

    <div class="score">
      <span class="home-score" id="homeScore">1</span>
      <span class="separator">:</span>
      <span class="away-score" id="awayScore">1</span>
    </div>

    <div class="status" id="status">
      ● SKORLAR DEĞİŞİYOR
    </div>

    <button class="stop-btn" onclick="stopMatch()">
      ⏹ SKORU DURDUR
    </button>

    <button class="restart-btn" onclick="restartMatch()">
      ↻ YENİDEN BAŞLAT
    </button>

  </div>
</main>

<div class="overlay" id="overlay">
  <div class="popup">

    <!-- PNG olarak kaydedilecek alan -->
    <div class="capture" id="capture">

      <div class="result-label">
        MAÇ SONUCU
      </div>

      <div class="result-date">
        03.11.2026 • 20:45
      </div>

      <div class="result-teams">
        <div class="team galatasaray">GALATASARAY</div>
        <div class="vs">X</div>
        <div class="team stuttgart">STUTTGART</div>
      </div>

      <div class="result-score" id="resultScore">
        <b>1</b> : 1
      </div>

      <div class="events">
        <div class="event-column">
          <div class="event-title">🟡 GALATASARAY</div>
          <div id="homeEvents"></div>
        </div>

        <div class="event-column">
          <div class="event-title">⚪ STUTTGART</div>
          <div id="awayEvents"></div>
        </div>
      </div>

      <div class="analysis">
        <h3>🎙️ MAÇ ANALİZİ</h3>
        <p id="analysisText"></p>
      </div>

    </div>

    <div class="popup-buttons">

      <button class="save-btn" onclick="saveImage()">
        📸 GÖRSEL OLARAK KAYDET
      </button>

      <button class="telegram-btn" onclick="shareTelegram()">
        ✈️ TELEGRAM'DA PAYLAŞ
      </button>

      <button class="close-btn" onclick="closePopup()">
        KAPAT
      </button>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

// Oyuncular örnek simülasyon havuzudur.
// Resmî maç kadrosu değildir.

const galatasarayPlayers = [
  "Victor Osimhen",
  "Mauro Icardi",
  "Barış Alper Yılmaz",
  "Leroy Sané",
  "Yunus Akgün",
  "Gabriel Sara",
  "Lucas Torreira",
  "Roland Sallai",
  "İlkay Gündoğan",
  "Eren Elmalı",
  "Abdülkerim Bardakcı",
  "Davinson Sánchez"
];

const stuttgartPlayers = [
  "Deniz Undav",
  "Ermedin Demirović",
  "Jamie Leweling",
  "Chris Führich",
  "Angelo Stiller",
  "Bilal El Khannouss",
  "Maximilian Mittelstädt",
  "Atakan Karazor",
  "Josha Vagnoman",
  "Tiago Tomás",
  "Nikolas Nartey",
  "Jeff Chabot"
];

let home = 1;
let away = 1;
let timer = null;
let stopped = false;

const homeScore = document.getElementById("homeScore");
const awayScore = document.getElementById("awayScore");

function random(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pick(array) {
  return array[random(0, array.length - 1)];
}

// 10 milisaniyede bir değişim
function startScores() {

  clearInterval(timer);

  timer = setInterval(() => {

    home = random(1, 8);
    away = random(1, 8);

    homeScore.textContent = home;
    awayScore.textContent = away;

  }, 10);

}

function generateGoals(score, players) {

  const minutes = [];

  // Gol dakikaları kronolojik sıralanır.
  for (let i = 0; i < score; i++) {
    minutes.push(random(1, 90));
  }

  minutes.sort((a, b) => a - b);

  return minutes.map(minute => {

    const scorer = pick(players);

    // Golcü ile asist yapan farklı kişiler.
    const assistants = players.filter(
      player => player !== scorer
    );

    const hasAssist = Math.random() > 0.12;

    return {
      minute,
      scorer,
      assist: hasAssist ? pick(assistants) : null
    };

  });

}

function renderGoals(goals) {

  return goals.map(goal => `

    <div class="event">

      <div>
        <span class="minute">${goal.minute}'</span>
        ⚽
        <span class="scorer">${goal.scorer}</span>
      </div>

      <div class="assist">
        ${
          goal.assist
          ? "🅰️ Asist: " + goal.assist
          : "Asistsiz gol"
        }
      </div>

    </div>

  `).join("");

}

function getAnalysis(home, away, homeGoals, awayGoals) {

  const difference = Math.abs(home - away);

  const homeTopScorer = homeGoals.reduce((result, goal) => {
    result[goal.scorer] = (result[goal.scorer] || 0) + 1;
    return result;
  }, {});

  const topScorer = Object.entries(homeTopScorer)
    .sort((a, b) => b[1] - a[1])[0];

  const star = topScorer ? topScorer[0] : "Osimhen";

  let comments = [];

  if (home > away) {

    comments = [
      `Galatasaray sahaya futbol oynamaya değil, Stuttgart'ın moralini bozmaya çıkmış! ${home} golün ardından Alman savunması navigasyondan çıkış arıyor. 😂`,

      `${star} bugün Stuttgart savunmasına zor anlar yaşattı. Alman ekibi maç sonunda savunma hattı için teknik servis çağırabilir! 🦁`,

      `RAMS Park'ta gol yağmuru! Stuttgart kalecisi maçtan sonra eldivenlerini satışa çıkarırsa şaşırmayın. 😂`,

      `Galatasaray hücumu öyle hızlıydı ki Stuttgart savunması pozisyonları ancak maç özetinden izleyebildi! 🔥`
    ];

    if (difference >= 5) {
      comments.push(
        `Bu artık galibiyet değil, futbol tarihine geçecek bir stres testi! Stuttgart savunması toplu izin dilekçesi hazırlıyor. 🤣`
      );
    }

  } else if (away > home) {

    comments = [
      `Galatasaray savunması bugün Stuttgart oyuncularına VIP geçiş kartı vermiş gibi! O kadar rahat geçtiler ki güvenlik kontrolü bile yapılmadı. 😂`,

      `Stuttgart ${away} gol attı. Galatasaray teknik heyeti savunmanın maç saatinden haberi olup olmadığını araştırıyor. 🤣`,

      `Galatasaray taraftarı bu skordan sonra televizyon kumandasını transfer listesine koyabilir. 😭`,

      `Stuttgart hücumcuları bugün İstanbul'da gol turizmine çıkmış. Galatasaray savunması da rehberlik yapmış! 😂`
    ];

    if (difference >= 5) {
      comments.push(
        `Galatasaray savunması için acil durum toplantısı! Toplantının ilk gündemi: Rakip oyuncular neden bu kadar yalnız kaldı? 😭`
      );
    }

  } else {

    comments = [
      `İki takım da savunma yapmamaya yemin etmiş! Kaleciler maç sonunda birbirlerine geçmiş olsun mesajı gönderdi. 😂`,

      `Bu maçta futbol değil, gol festivali vardı. Savunmacılar ise festivale katılmamayı tercih etti! 🤣`,

      `Galatasaray ve Stuttgart birbirine gol hediye etmekten maçı bitiremedi. Tam bir karşılıklı ikramlaşma! ⚽`,

      `Beraberlik çıktı ama kalecilerin psikolojisi berabere kalmadı. İkisi de maçın bitiş düdüğünü bekliyordu! 😂`
    ];

    if (home >= 6) {
      comments.push(
        `${home}-${away} biten maçta skor tabelası fazla mesaiden şikâyetçi! Kaleciler için psikolojik destek hattı açılabilir. 🤣`
      );
    }

  }

  return pick(comments);

}

function stopMatch() {

  if (stopped) return;

  stopped = true;
  clearInterval(timer);

  document.getElementById("status").textContent =
    "● MAÇ SONUCU BELİRLENDİ";

  const homeGoals = generateGoals(
    home,
    galatasarayPlayers
  );

  const awayGoals = generateGoals(
    away,
    stuttgartPlayers
  );

  document.getElementById("resultScore").innerHTML =
    `<b>${home}</b> : ${away}`;

  document.getElementById("homeEvents").innerHTML =
    renderGoals(homeGoals);

  document.getElementById("awayEvents").innerHTML =
    renderGoals(awayGoals);

  document.getElementById("analysisText").textContent =
    getAnalysis(home, away, homeGoals, awayGoals);

  document.getElementById("overlay")
    .classList.add("active");

}

function restartMatch() {

  stopped = false;

  document.getElementById("overlay")
    .classList.remove("active");

  document.getElementById("status").textContent =
    "● SKORLAR DEĞİŞİYOR";

  startScores();

}

function closePopup() {

  document.getElementById("overlay")
    .classList.remove("active");

}

// Popup'ın orijinal tasarımını PNG'ye dönüştür.
async function createImageBlob() {

  if (typeof html2canvas === "undefined") {
    throw new Error(
      "Görsel oluşturma kütüphanesi yüklenemedi. İnternet bağlantını kontrol et."
    );
  }

  const capture = document.getElementById("capture");

  // Ekranda popup küçük olsa bile tam içerik yakalanır.
  const canvas = await html2canvas(capture, {
    backgroundColor: null,
    scale: 2,
    useCORS: true,
    logging: false,
    scrollX: 0,
    scrollY: 0,
    windowWidth: document.documentElement.clientWidth,
    onclone: clonedDocument => {
      const clonedCapture =
        clonedDocument.getElementById("capture");

      clonedCapture.style.animation = "none";
    }
  });

  return new Promise((resolve, reject) => {

    canvas.toBlob(blob => {

      if (blob) {
        resolve(blob);
      } else {
        reject(new Error("PNG oluşturulamadı."));
      }

    }, "image/png");

  });

}

function downloadBlob(blob) {

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download =
    `Galatasaray-Stuttgart-${home}-${away}.png`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

}

async function saveImage() {

  try {

    const blob = await createImageBlob();

    downloadBlob(blob);

  } catch (error) {

    alert(error.message);

  }

}

async function shareTelegram() {

  try {

    const blob = await createImageBlob();

    const file = new File(
      [blob],
      `Galatasaray-Stuttgart-${home}-${away}.png`,
      { type: "image/png" }
    );

    // Mobil cihazlarda Telegram'a doğrudan
    // görsel göndermek için paylaşım menüsü.
    if (
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        files: [file],
        title: "Galatasaray × Stuttgart",
        text: `Galatasaray ${home} - ${away} Stuttgart`
      });

    } else {

      // Tarayıcı dosya paylaşımını desteklemiyorsa
      // görsel indirilir ve Telegram açılır.
      downloadBlob(blob);

      const text = encodeURIComponent(
        `⚽ Galatasaray ${home} - ${away} Stuttgart\n03.11.2026 | 20:45`
      );

      window.open(
        `https://t.me/share/url?text=${text}`,
        "_blank"
      );

      alert(
        "Görsel PNG olarak kaydedildi. Telegram'da paylaşmak için kaydedilen görseli seç."
      );

    }

  } catch (error) {

    // Kullanıcı paylaşımı iptal ederse hata gösterme.
    if (error.name !== "AbortError") {
      alert(error.message);
    }

  }

}

// Sayfa açıldığında skorlar değişmeye başlar.
startScores();

</script>

</body>
</html>
