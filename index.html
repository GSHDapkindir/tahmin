<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galatasaray × Stuttgart</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --yellow: #ffdc35;
  --red: #e50932;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top left, #631425, transparent 48%),
    radial-gradient(ellipse at bottom right, #674313, transparent 48%),
    #100b12;
}

.app {
  width: 100%;
  max-width: 520px;
}

.match-card {
  padding: 28px 18px;
  text-align: center;
  border-radius: 24px;
  border: 1px solid #70402f;
  background: linear-gradient(145deg, #301822, #130e15);
  box-shadow: 0 20px 60px #0008;
}

.date {
  margin-bottom: 30px;
  color: #ffdc91;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.teams,
.result-teams {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
  gap: 8px;
  align-items: center;
}

.team {
  min-width: 0;
  font-size: clamp(13px, 3.6vw, 21px);
  font-weight: 900;
  overflow-wrap: anywhere;
}

/*
  GALATASARAY YAZISI

  CSS background-clip:text kullanılmıyor.
  Her harf gerçek metin olarak renklendiriliyor.

  Böylece html2canvas'ın renkli dikdörtgen
  oluşturma problemi önleniyor.
*/

.galatasaray {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  white-space: nowrap;
  font-size: clamp(10px, 2.65vw, 18px);
  letter-spacing: -0.45px;
  filter: drop-shadow(0 0 7px #ffb52b66);
}

.galatasaray span {
  display: inline-block;
  color: var(--letter-color);
  -webkit-text-fill-color: var(--letter-color);
  animation: letterGlow 1.8s ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes letterGlow {
  from {
    text-shadow: 0 0 2px #ffcb3533;
  }

  to {
    text-shadow: 0 0 9px #ffca35aa;
  }
}

.stuttgart {
  color: white;
  text-shadow: 0 0 12px #ffffff65;
}

.vs {
  font-size: 12px;
  color: #a99a9f;
  font-weight: bold;
}

.score {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin: 30px 0;
  font-size: clamp(65px, 17vw, 105px);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.score span {
  min-width: 80px;
}

.score .separator {
  min-width: auto;
  font-size: 55px;
  color: #ffca47;
}

.home-score {
  color: #ffdc35;
  text-shadow: 0 0 25px #ffbb3444;
}

.away-score {
  color: white;
}

.status {
  display: inline-block;
  margin-bottom: 25px;
  color: #ffdc35;
  font-size: 12px;
  letter-spacing: 2px;
}

button {
  border: none;
  border-radius: 13px;
  padding: 16px 20px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  transition: transform .15s;
}

button:active {
  transform: scale(.96);
}

.stop-btn {
  width: 100%;
  color: #180c0e;
  background: linear-gradient(
    110deg,
    #ffdf42,
    #ff922c,
    #e8193b
  );
  box-shadow: 0 7px 25px #ff4a2440;
}

.restart-btn {
  width: 100%;
  margin-top: 12px;
  color: white;
  background: #35232b;
  border: 1px solid #69404a;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 12px;
  overflow-y: auto;
  background: #000c;
}

.overlay.active {
  display: flex;
}

.popup {
  width: 100%;
  max-width: 480px;
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  scrollbar-width: thin;
}

.capture {
  position: relative;
  padding: 27px 17px 23px;
  text-align: center;
  overflow: hidden;
  border: 2px solid #c18a39;
  border-radius: 22px;
  background:
    radial-gradient(circle at 0% 0%, #7c202e, transparent 45%),
    radial-gradient(circle at 100% 100%, #745018, transparent 45%),
    linear-gradient(150deg, #28141e, #100c14);
}

.capture::before {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 0;
  height: 3px;
  background: linear-gradient(
    90deg,
    transparent,
    #ffe05b,
    #e50932,
    transparent
  );
}

.result-label {
  color: #ffdc80;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: 900;
}

.result-date {
  margin-top: 9px;
  color: #c5aeb3;
  font-size: 12px;
}

.result-teams {
  margin-top: 25px;
}

.result-score {
  margin: 12px 0 20px;
  color: white;
  font-size: clamp(58px, 14vw, 82px);
  font-weight: 900;
  text-shadow: 0 0 25px #e5093255;
}

.result-score b {
  color: #ffdc35;
}

.events {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap: 10px;
  margin-top: 20px;
  text-align: left;
}

.event-column {
  min-width: 0;
  padding: 12px 9px;
  border: 1px solid #ffffff16;
  border-radius: 13px;
  background: #ffffff09;
}

.event-title {
  margin-bottom: 12px;
  padding-bottom: 9px;
  color: #ffdb6b;
  font-size: 12px;
  font-weight: 900;
  border-bottom: 1px solid #ffffff20;
}

.event {
  margin-bottom: 13px;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.event:last-child {
  margin-bottom: 0;
}

.minute {
  color: #ffdc35;
  font-weight: bold;
}

.scorer {
  color: white;
  font-weight: bold;
}

.assist {
  color: #bcb1b6;
  font-size: 11px;
}

.analysis {
  margin-top: 18px;
  padding: 15px;
  text-align: left;
  border: 1px solid #ffce3240;
  border-radius: 13px;
  background: #ffce3210;
}

.analysis h3 {
  margin: 0 0 10px;
  color: #ffdb62;
  font-size: 14px;
}

.analysis p {
  margin: 0;
  color: #f5e8e6;
  font-size: 13px;
  line-height: 1.7;
}

.popup-buttons {
  display: grid;
  gap: 9px;
  margin-top: 12px;
}

.save-btn {
  color: #1c1010;
  background: linear-gradient(110deg, #ffdd43, #ff9e2d);
}

.telegram-btn {
  color: white;
  background: #229ed9;
}

.close-btn {
  color: white;
  background: #37252d;
}

@media (max-width: 380px) {
  .match-card {
    padding: 24px 12px;
  }

  .score {
    gap: 10px;
  }

  .capture {
    padding: 23px 10px;
  }

  .event-column {
    padding: 10px 7px;
  }
}
</style>
</head>

<body>

<main class="app">
  <div class="match-card">

    <div class="date">
      03.11.2026 • 20:45
    </div>

    <div class="teams">
      <div class="team galatasaray">GALATASARAY</div>
      <div class="vs">X</div>
      <div class="team stuttgart">STUTTGART</div>
    </div>

    <div class="score">
      <span class="home-score" id="homeScore">1</span>
      <span class="separator">:</span>
      <span class="away-score" id="awayScore">1</span>
    </div>

    <div class="status" id="status">
      ● SKORLAR DEĞİŞİYOR
    </div>

    <button class="stop-btn" onclick="stopMatch()">
      ⏹ SKORU DURDUR
    </button>

    <button class="restart-btn" onclick="restartMatch()">
      ↻ YENİDEN BAŞLAT
    </button>

  </div>
</main>

<div class="overlay" id="overlay">
  <div class="popup">

    <!-- PNG olarak kaydedilecek bölüm -->
    <div class="capture" id="capture">

      <div class="result-label">
        MAÇ SONUCU
      </div>

      <div class="result-date">
        03.11.2026 • 20:45
      </div>

      <div class="result-teams">
        <div class="team galatasaray">GALATASARAY</div>
        <div class="vs">X</div>
        <div class="team stuttgart">STUTTGART</div>
      </div>

      <div class="result-score" id="resultScore">
        <b>1</b> : 1
      </div>

      <div class="events">

        <div class="event-column">
          <div class="event-title">
            🟡 GALATASARAY
          </div>
          <div id="homeEvents"></div>
        </div>

        <div class="event-column">
          <div class="event-title">
            ⚪ STUTTGART
          </div>
          <div id="awayEvents"></div>
        </div>

      </div>

      <div class="analysis">
        <h3>🎙️ MAÇ ANALİZİ</h3>
        <p id="analysisText"></p>
      </div>

    </div>

    <div class="popup-buttons">

      <button class="save-btn" onclick="saveImage()">
        📸 GÖRSEL OLARAK KAYDET
      </button>

      <button class="telegram-btn" onclick="shareTelegram()">
        ✈️ TELEGRAM'DA PAYLAŞ
      </button>

      <button class="close-btn" onclick="closePopup()">
        KAPAT
      </button>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

// Galatasaray yazısını gerçek renkli harflere dönüştür.
// Böylece PNG'de background-clip sorunu oluşmaz.

function setupGalatasarayText() {

  const colors = [
    "#ffdc35",
    "#ffd13c",
    "#ffbb38",
    "#ff993b",
    "#ff7140",
    "#ff4c42",
    "#ed3041",
    "#d7193d",
    "#f04a3e",
    "#ff9a3b",
    "#ffdc35"
  ];

  document.querySelectorAll(".galatasaray").forEach(el => {

    const text = "GALATASARAY";

    el.textContent = "";

    [...text].forEach((letter, index) => {

      const span = document.createElement("span");

      span.textContent = letter;

      span.style.setProperty(
        "--letter-color",
        colors[index % colors.length]
      );

      span.style.setProperty(
        "--delay",
        `${index * 0.1}s`
      );

      el.appendChild(span);

    });

  });

}

setupGalatasarayText();

// Oyuncular örnek simülasyon havuzudur.
// Resmî maç kadrosu değildir.

const galatasarayPlayers = [
  "Victor Osimhen",
  "Rafael Leao",
  "Barış Alper Yılmaz",
  "Leroy Sané",
  "Yunus Akgün",
  "Gabriel Sara",
  "Lucas Torreira",
  "Roland Sallai",
  "Aleksei Batrakov",
  "Renato Nhaga",
  "Lesley Uguçüküü",
  "Davinson Sánchez"
];

const stuttgartPlayers = [
  
  "Ermedin Demirović",
  "Jamie Leweling",
  "Chris Führich",
  "Angelo Stiller",
  "Bilal El Khannouss",
  "Maximilian Mittelstädt",
  "Atakan Karazor",
  "Josha Vagnoman",
  "Tiago Tomás",
  "Nikolas Nartey",
  "Jeff Chabot"
];

let home = 1;
let away = 1;
let timer = null;
let stopped = false;

const homeScore = document.getElementById("homeScore");
const awayScore = document.getElementById("awayScore");

function random(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pick(array) {
  return array[random(0, array.length - 1)];
}

// Çok hızlı skor değişimi
function startScores() {

  clearInterval(timer);

  timer = setInterval(() => {

    home = random(1, 8);
    away = random(1, 8);

    homeScore.textContent = home;
    awayScore.textContent = away;

  }, 10);

}

function generateGoals(score, players) {

  const minutes = [];

  for (let i = 0; i < score; i++) {
    minutes.push(random(1, 90));
  }

  minutes.sort((a, b) => a - b);

  return minutes.map(minute => {

    const scorer = pick(players);

    const assistants = players.filter(
      player => player !== scorer
    );

    const hasAssist = Math.random() > 0.12;

    return {
      minute,
      scorer,
      assist: hasAssist ? pick(assistants) : null
    };

  });

}

function renderGoals(goals) {

  return goals.map(goal => `

    <div class="event">

      <div>
        <span class="minute">${goal.minute}'</span>
        ⚽
        <span class="scorer">${goal.scorer}</span>
      </div>

      <div class="assist">
        ${
          goal.assist
            ? "🅰️ Asist: " + goal.assist
            : "Asistsiz gol"
        }
      </div>

    </div>

  `).join("");

}

function getAnalysis(home, away, homeGoals, awayGoals) {

  const difference = Math.abs(home - away);

  const scorerCounts = {};

  homeGoals.forEach(goal => {
    scorerCounts[goal.scorer] =
      (scorerCounts[goal.scorer] || 0) + 1;
  });

  const topScorer = Object.entries(scorerCounts)
    .sort((a, b) => b[1] - a[1])[0];

  const star = topScorer ? topScorer[0] : "Osimhen";

  let comments = [];

  if (home > away) {

    comments = [

      `Galatasaray sahaya futbol oynamaya değil, Stuttgart'ın moralini bozmaya çıkmış! ${home} golün ardından Alman savunması navigasyondan çıkış arıyor. 😂`,

      `${star} bugün Stuttgart savunmasına zor anlar yaşattı. Alman ekibi maç sonunda savunma hattı için teknik servis çağırabilir! 🦁`,

      `RAMS Park'ta gol yağmuru! Stuttgart kalecisi maçtan sonra eldivenlerini satışa çıkarırsa şaşırmayın. 😂`,

      `Galatasaray hücumu öyle hızlıydı ki Stuttgart savunması pozisyonları ancak maç özetinden izleyebildi! 🔥`

    ];

    if (difference >= 5) {
      comments.push(
        `Bu artık galibiyet değil, futbol tarihine geçecek bir stres testi! Stuttgart savunması toplu izin dilekçesi hazırlıyor. 🤣`
      );
    }

  } else if (away > home) {

    comments = [

      `Galatasaray savunması bugün Stuttgart oyuncularına VIP geçiş kartı vermiş gibi! O kadar rahat geçtiler ki güvenlik kontrolü bile yapılmadı. 😂`,

      `Stuttgart ${away} gol attı. Galatasaray teknik heyeti savunmanın maç saatinden haberi olup olmadığını araştırıyor. 🤣`,

      `Galatasaray taraftarı bu skordan sonra televizyon kumandasını transfer listesine koyabilir. 😭`,

      `Stuttgart hücumcuları bugün İstanbul'da gol turizmine çıkmış. Galatasaray savunması da rehberlik yapmış! 😂`

    ];

    if (difference >= 5) {
      comments.push(
        `Galatasaray savunması için acil durum toplantısı! Toplantının ilk gündemi: Rakip oyuncular neden bu kadar yalnız kaldı? 😭`
      );
    }

  } else {

    comments = [

      `İki takım da savunma yapmamaya yemin etmiş! Kaleciler maç sonunda birbirlerine geçmiş olsun mesajı gönderdi. 😂`,

      `Bu maçta futbol değil, gol festivali vardı. Savunmacılar ise festivale katılmamayı tercih etti! 🤣`,

      `Galatasaray ve Stuttgart birbirine gol hediye etmekten maçı bitiremedi. Tam bir karşılıklı ikramlaşma! ⚽`,

      `Beraberlik çıktı ama kalecilerin psikolojisi berabere kalmadı. İkisi de maçın bitiş düdüğünü bekliyordu! 😂`

    ];

    if (home >= 6) {
      comments.push(
        `${home}-${away} biten maçta skor tabelası fazla mesaiden şikâyetçi! Kaleciler için psikolojik destek hattı açılabilir. 🤣`
      );
    }

  }

  return pick(comments);

}

function stopMatch() {

  if (stopped) return;

  stopped = true;

  clearInterval(timer);

  document.getElementById("status").textContent =
    "● MAÇ SONUCU BELİRLENDİ";

  const homeGoals = generateGoals(
    home,
    galatasarayPlayers
  );

  const awayGoals = generateGoals(
    away,
    stuttgartPlayers
  );

  document.getElementById("resultScore").innerHTML =
    `<b>${home}</b> : ${away}`;

  document.getElementById("homeEvents").innerHTML =
    renderGoals(homeGoals);

  document.getElementById("awayEvents").innerHTML =
    renderGoals(awayGoals);

  document.getElementById("analysisText").textContent =
    getAnalysis(home, away, homeGoals, awayGoals);

  document.getElementById("overlay")
    .classList.add("active");

}

function restartMatch() {

  stopped = false;

  document.getElementById("overlay")
    .classList.remove("active");

  document.getElementById("status").textContent =
    "● SKORLAR DEĞİŞİYOR";

  startScores();

}

function closePopup() {

  document.getElementById("overlay")
    .classList.remove("active");

}

// PNG oluşturma
// Galatasaray harfleri gerçek renkli metin olduğu
// için renkli dikdörtgen oluşması önlenir.

async function createImageBlob() {

  if (typeof html2canvas === "undefined") {
    throw new Error(
      "Görsel oluşturma kütüphanesi yüklenemedi. İnternet bağlantını kontrol et."
    );
  }

  const capture = document.getElementById("capture");

  await document.fonts.ready;

  const canvas = await html2canvas(capture, {

    backgroundColor: "#100c14",
    scale: 3,
    useCORS: true,
    logging: false,
    scrollX: 0,
    scrollY: 0,

    onclone: clonedDocument => {

      const clonedCapture =
        clonedDocument.getElementById("capture");

      // Görselde animasyonları durdur.
      clonedCapture.querySelectorAll("*").forEach(el => {
        el.style.animation = "none";
        el.style.transition = "none";
      });

      // Galatasaray harflerini görünür tut.
      clonedCapture
        .querySelectorAll(".galatasaray span")
        .forEach(el => {

          const color = el.style.getPropertyValue(
            "--letter-color"
          ) || "#ffdc35";

          el.style.background = "none";
          el.style.backgroundImage = "none";

          el.style.color = color;
          el.style.webkitTextFillColor = color;

          el.style.opacity = "1";
          el.style.visibility = "visible";
          el.style.filter = "none";

          el.style.textShadow =
            "0 0 4px rgba(255,200,50,0.45)";

        });

      // Stuttgart beyaz kalır.
      clonedCapture
        .querySelectorAll(".stuttgart")
        .forEach(el => {

          el.style.color = "#ffffff";
          el.style.webkitTextFillColor = "#ffffff";
          el.style.opacity = "1";

        });

    }

  });

  return new Promise((resolve, reject) => {

    canvas.toBlob(blob => {

      if (blob) {
        resolve(blob);
      } else {
        reject(new Error("PNG oluşturulamadı."));
      }

    }, "image/png");

  });

}

function downloadBlob(blob) {

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;

  link.download =
    `Galatasaray-Stuttgart-${home}-${away}.png`;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

}

async function saveImage() {

  try {

    const blob = await createImageBlob();

    downloadBlob(blob);

  } catch (error) {

    alert(error.message);

  }

}

async function shareTelegram() {

  try {

    const blob = await createImageBlob();

    const file = new File(
      [blob],
      `Galatasaray-Stuttgart-${home}-${away}.png`,
      { type: "image/png" }
    );

    if (
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        files: [file],
        title: "Galatasaray × Stuttgart",
        text: `Galatasaray ${home} - ${away} Stuttgart`
      });

    } else {

      downloadBlob(blob);

      const text = encodeURIComponent(
        `⚽ Galatasaray ${home} - ${away} Stuttgart\n03.11.2026 | 20:45`
      );

      window.open(
        `https://t.me/share/url?text=${text}`,
        "_blank"
      );

      alert(
        "Görsel PNG olarak kaydedildi. Telegram'da paylaşmak için kaydedilen görseli seç."
      );

    }

  } catch (error) {

    if (error.name !== "AbortError") {
      alert(error.message);
    }

  }

}

// Başlangıç
startScores();

</script>

</body>
</html>
