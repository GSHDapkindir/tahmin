<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galatasaray × Stuttgart | Skor</title>
<style>
:root{--red:#b50927;--dark:#18040b;--gold:#ffd044;--cream:#fff6e0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0%,#77202a,transparent 40%),radial-gradient(circle at 90% 95%,#8e520d,transparent 42%),#17060b;color:white;display:flex;align-items:center;justify-content:center;padding:20px}.shell{width:min(100%,570px);border:1px solid #ffffff24;border-radius:28px;padding:25px;background:#220911dd;box-shadow:0 24px 90px #0008;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--gold) 50%,var(--red) 50%)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;color:var(--gold);text-align:center;margin-top:10px}.title{text-align:center;font-weight:1000;font-size:clamp(26px,7vw,42px);letter-spacing:-1.5px;margin:9px 0 4px}.subtitle{text-align:center;color:#f7cdd1;font-size:13px;margin:0 0 26px}.board{background:linear-gradient(145deg,#3c0d19,#17060c);border:1px solid #f6c44350;border-radius:22px;padding:22px 14px;box-shadow:inset 0 0 45px #0005}.live{display:table;margin:0 auto 24px;background:#d71936;border-radius:100px;padding:7px 13px;font-size:11px;font-weight:900;letter-spacing:2px}.live:before{content:"● ";animation:blink .6s infinite alternate}@keyframes blink{to{opacity:.3}}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}.team{font-weight:900;font-size:clamp(13px,3.5vw,19px);overflow-wrap:anywhere}.crest{width:64px;height:64px;border-radius:50%;margin:0 auto 13px;display:grid;place-items:center;font-size:24px;font-weight:1000;border:3px solid #fff5;box-shadow:0 0 30px #0006}.gs{background:linear-gradient(90deg,#ffcd32 50%,#b60827 50%);color:#25100a}.rival{background:#263344;color:white}.score{font-variant-numeric:tabular-nums;font-weight:1000;font-size:clamp(46px,11vw,74px);letter-spacing:-4px;white-space:nowrap;color:var(--gold);text-shadow:0 0 24px #ffd04445}.hint{text-align:center;font-size:12px;color:#d5a7ae;margin:22px 0 16px}.actions{display:grid;gap:11px;margin-top:18px}button{cursor:pointer;border:0;border-radius:14px;padding:16px 18px;font:900 15px system-ui;transition:transform .15s,filter .15s}button:active{transform:scale(.97)}.primary{background:linear-gradient(115deg,#ffe17c,#ffb800);color:#301004;box-shadow:0 8px 22px #ffbd0040}.secondary{background:#fff1;color:#fff;border:1px solid #ffffff3a}.smallprint{text-align:center;color:#c48f99;font-size:11px;margin-top:20px}.overlay{position:fixed;inset:0;background:#080207d9;display:none;align-items:center;justify-content:center;z-index:10;padding:16px;overflow:auto}.overlay.show{display:flex}.modal{width:min(100%,490px);max-height:calc(100vh - 32px);overflow:auto}.capture{width:100%;position:relative;overflow:hidden;background:linear-gradient(145deg,#5b0d21 0%,#250713 53%,#13070e 100%);border:2px solid #efbd4a;border-radius:24px;padding:28px 20px 24px;text-align:center;box-shadow:0 20px 80px #000b}.capture:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#ffc82e 50%,#c61030 50%)}.capture:after{content:"★";position:absolute;right:-30px;top:40px;font-size:170px;color:#ffffff06;pointer-events:none}.badge{color:#ffd75d;font-size:11px;font-weight:900;letter-spacing:3px;margin:9px 0 12px}.finalTitle{font-size:32px;font-weight:1000;letter-spacing:-1px;margin:0 0 7px}.date{font-size:12px;color:#f6c8cc}.resultTeams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:24px 0 18px}.resultName{font-size:13px;font-weight:900;overflow-wrap:anywhere}.resultScore{font-size:clamp(45px,11vw,67px);font-weight:1000;color:#ffcf43;white-space:nowrap;font-variant-numeric:tabular-nums}.divider{height:1px;background:linear-gradient(90deg,transparent,#ffda7390,transparent);margin:20px 0}.analysisLabel{font-size:11px;font-weight:1000;letter-spacing:2px;color:#ffdc68}.analysis{font-size:16px;line-height:1.6;font-weight:700;margin:12px 0 10px;min-height:70px}.footerMark{font-size:10px;color:#ffda8a;letter-spacing:2px;font-weight:900;margin-top:20px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.modalActions button{font-size:12px;padding:13px 8px}.close{width:100%;margin-top:10px;background:transparent;color:white;border:1px solid #fff5}.status{font-size:12px;color:#ffdc68;text-align:center;min-height:18px;margin:10px 0 0}@media(max-width:360px){.shell{padding:16px}.board{padding:18px 8px}.crest{width:49px;height:49px}.modalActions{grid-template-columns:1fr}.capture{padding:23px 12px}}
.wordmark{font-size:clamp(10px,2.5vw,15px);font-weight:1000;letter-spacing:-.5px;margin:0 auto 13px;line-height:1.2;overflow-wrap:anywhere}.gsword{background:linear-gradient(110deg,#ffe86a 10%,#ffbd23 34%,#ff365e 62%,#ffe66e 95%);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 2s linear infinite;filter:drop-shadow(0 0 7px #ffba5266)}@keyframes shine{to{background-position:200% center}}.rivalword{color:#fff;text-shadow:0 0 12px #fff7}.crest{display:none}.goalColumns{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin:18px 0 8px}.goalHeading{font-size:10px;color:#ffda73;font-weight:900;letter-spacing:.6px;margin-bottom:9px}.goalRow{padding:7px 0;border-bottom:1px solid #ffffff18;font-size:12px;line-height:1.45}.goalRow strong{display:block;color:white}.goalRow span{display:block;color:#e9bfc5;font-size:11px}.smallprint{margin-bottom:0}.resultTeams{margin:18px 0 12px}.resultName{display:none}.capture{overflow:hidden}.modal{scrollbar-width:thin}@media(max-width:400px){.goalColumns{gap:8px}.goalRow{font-size:11px}.goalHeading{font-size:9px}}
</style>
</head>
<body>
<main class="shell"><h1 class="title">CANLI SKOR</h1><p class="subtitle">GALATASARAY × STUTTGART • 20:45</p><section class="board"><div class="live" id="live">CANLI • SKOR AKIYOR</div><div class="teams"><div><div class="wordmark gsword">GALATASARAY</div><div class="team">GALATASARAY</div></div><div class="score"><span id="home">1</span> : <span id="away">1</span></div><div><div class="wordmark rivalword">STUTTGART</div><div class="team" id="rivalLabel">STUTTGART</div></div></div></section><div class="actions"><button class="primary" id="stop">⏹ SKORU DURDUR</button><button class="secondary" id="restart">↻ YENİDEN BAŞLAT</button></div><p class="smallprint">Simülasyon • Gerçek maç verisi değildir.</p></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Maç sonucu"><div class="modal"><div class="capture" id="capture"><h2 class="finalTitle">MAÇ SONUCU</h2><div class="date" id="date"></div><div class="resultTeams"><div><div class="wordmark gsword">GALATASARAY</div><div class="resultName">GALATASARAY</div></div><div class="resultScore" id="resultScore">1 : 1</div><div><div class="wordmark rivalword">STUTTGART</div><div class="resultName" id="resultRival">STUTTGART</div></div></div><div class="goalColumns"><div><div class="goalHeading">GALATASARAY GOLLERİ</div><div id="homeGoals"></div></div><div><div class="goalHeading">STUTTGART GOLLERİ</div><div id="awayGoals"></div></div></div><div class="divider"></div><div class="analysisLabel">🎙️ MAÇ ANALİZİ</div><p class="analysis" id="analysis"></p></div><div class="modalActions"><button class="primary" id="save">📸 GÖRSEL OLARAK KAYDET</button><button class="secondary" id="telegram">✈️ TELEGRAM'DA PAYLAŞ</button></div><button class="close" id="close">✕ KAPAT</button><p class="status" id="status" aria-live="polite"></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);let timer=null,h=1,a=1,stopped=false;const rand=()=>Math.floor(Math.random()*8)+1;
function tick(){h=rand();a=rand();$('home').textContent=h;$('away').textContent=a}function start(){clearInterval(timer);stopped=false;$('overlay').classList.remove('show');$('live').textContent='CANLI • SKOR AKIYOR';tick();timer=setInterval(tick,10)}
function commentary(x,y){let d=x-y,arr;if(x===8&&y===8)arr=['Bu maçta kaleciler sahaya değil, pikniğe gelmiş! 8-8 nedir, halı saha aboneliği mi? 😭','VAR bile skoru sayarken hesap makinesini kırdı. 8-8! 🤯'];else if(x===y)arr=['İki takım da kazanmayı düşündü, sonra beraberliğe el sıkıştı. 🤝😂','Tabela eşit, tansiyon yüksek; kazanan yalnızca çekirdekçi oldu! 🌻'];else if(d>=5)arr=['Rakip savunma maç boyunca “beni etiketlemeyin” modundaydı! 🫣🔥','Bu maç değil, gol yağmuru! Rakip kaleci hava durumu uyarısı bekliyor. ☔⚽'];else if(d>=2)arr=['Aslan kükredi, rakip savunma Wi-Fi bağlantısını kaybetti! 🦁📶','Galatasaray gazı kökledi; rakip hâlâ park yeri arıyor! 🚗💨'];else if(d===1)arr=['Üç puan cepte, taraftarın nabzı uzayda! 🫀🚀','Tek farkla galibiyet: Aslan işi son dakikaya bırakıp heyecan sattı! 😅'];else if(d<=-5)arr=['Skor tabelası acil servis çağırdı. Bu sonuç unutulmaz... keşke unutulsa! 😭','Savunma bugün uzaktan çalışmış; kimse ofise gelmemiş! 🏠💻'];else if(d<=-2)arr=['Savunma çay molasına çıkmış, dönüş saati belli değil! ☕😬','Bu skorun ardından taktik tahtası istifa dilekçesi yazdı! 📝😂'];else arr=['Bir gol farkla kayıp... futbol tanrıları bugün şakacı! 😵','Son düdük geldi, umutlar gelecek maça ertelendi! 🥲'];return arr[Math.floor(Math.random()*arr.length)]}
const players={home:['Victor Osimhen','Mauro Icardi','Barış Alper Yılmaz','Yunus Akgün','Gabriel Sara','Lucas Torreira','Roland Sallai','Leroy Sané'],away:['Deniz Undav','Ermedin Demirović','Jamie Leweling','Chris Führich','Angelo Stiller','Enzo Millot','Atakan Karazor','Maximilian Mittelstädt']};
function goals(side,count){const squad=players[side],minutes=Array.from({length:count},()=>Math.floor(Math.random()*90)+1).sort((a,b)=>a-b);return minutes.map(min=>{let scorer=Math.floor(Math.random()*squad.length),assist=Math.floor(Math.random()*(squad.length-1));if(assist>=scorer)assist++;return `<div class="goalRow"><strong>⚽ ${min}' ${squad[scorer]}</strong><span>🅰️ Asist: ${squad[assist]}</span></div>`}).join('')}
function stop(){if(stopped)return;clearInterval(timer);stopped=true;$('live').textContent='MAÇ BİTTİ';$('resultScore').textContent=`${h} : ${a}`;$('analysis').textContent=commentary(h,a);$('homeGoals').innerHTML=goals('home',h);$('awayGoals').innerHTML=goals('away',a);$('date').textContent='03.11.2026 • 20:45';$('status').textContent='';$('overlay').classList.add('show')}
async function imageBlob(){if(!window.html2canvas)throw new Error('Görsel kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.');const node=$('capture');const canvas=await html2canvas(node,{backgroundColor:null,scale:Math.max(2,Math.min(3,window.devicePixelRatio||2)),useCORS:true,logging:false,scrollX:0,scrollY:0});return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG oluşturulamadı.')),'image/png'))}
function filename(){return `aslan-skor-${h}-${a}.png`}async function save(){try{$('status').textContent='Görsel hazırlanıyor…';const blob=await imageBlob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename();document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);$('status').textContent='Popup tasarımı PNG olarak kaydedildi. ✅'}catch(e){$('status').textContent=e.message}}
async function telegram(){try{$('status').textContent='Paylaşım görseli hazırlanıyor…';const blob=await imageBlob();const file=new File([blob],filename(),{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Aslan Skor • Maç Sonucu'});$('status').textContent='Paylaşım menüsü açıldı. Telegram’ı seçebilirsiniz.'}else{await save();const msg=encodeURIComponent(`🟡🔴 Galatasaray ${h}-${a} Stuttgart\n🎙️ ${$('analysis').textContent}`);window.open('https://t.me/share/url?url=&text='+msg,'_blank','noopener,noreferrer');$('status').textContent='PNG kaydedildi. Telegram açıldı; görseli sohbetten ekleyebilirsiniz.'}}catch(e){if(e.name==='AbortError'){$('status').textContent='Paylaşım iptal edildi.'}else{$('status').textContent=e.message}}}
$('stop').addEventListener('click',stop);$('restart').addEventListener('click',start);$('close').addEventListener('click',()=>$('overlay').classList.remove('show'));$('save').addEventListener('click',save);$('telegram').addEventListener('click',telegram);start();
</script></body></html>
